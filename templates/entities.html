{% extends "base.html" %}
{% from "_hero.html" import render_hero %}

{% block content %}
{{ render_hero("Entities", "List of entities", "entities", base_url) }}

<section class="section">
    <div class="field">
        <div class="control">
            <input id="entity-filter" class="input" type="search" aria-label="Filter entities by name, URI or type" placeholder="Filter by name, URI or type" autocomplete="off">
        </div>
        <p class="help" id="entity-count" aria-live="polite"></p>
    </div>
    <div id="entities-grid" class="grid is-col-min-24"></div>
</section>

<section class="section">
    <nav class="pagination is-centered" role="navigation" aria-label="pagination">
        <button type="button" class="pagination-previous" id="entity-prev">Previous</button>
        <button type="button" class="pagination-next" id="entity-next">Next</button>
        <ul class="pagination-list" id="pagination"></ul>
    </nav>
</section>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const PAGE_SIZE = 15;
  const grid = document.getElementById("entities-grid");
  const list = document.getElementById("pagination");
  const filterInput = document.getElementById("entity-filter");
  const counter = document.getElementById("entity-count");
  const prev = document.getElementById("entity-prev");
  const next = document.getElementById("entity-next");

  const { types, labels, rows } = await (await fetch("{{ base_url }}entities.json", { cache: "no-cache" })).json();
  const haystack = rows.map(r => [r[0], r[6] || "", ...r[2].map(i => types[i] + " " + labels[i])].join(" ").toLowerCase());
  let visible = rows.map((_, i) => i);
  let page = 1;

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function stat(value, label) {
    const item = el("div", "level-item has-text-centered");
    const box = item.appendChild(el("div"));
    box.appendChild(el("p", "title is-4 mb-1", value.toLocaleString("en")));
    box.appendChild(el("p", "is-size-7 has-text-grey-dark", label));
    return item;
  }

  function card([uri, href, typeIdx, asSubject, asObject, related, label]) {
    const c = el("div", "card cell entity");
    const link = el("a", "", label || uri);
    link.href = href;
    c.appendChild(el("header", "card-header")).appendChild(el("h2", "card-header-title")).appendChild(link);
    const body = c.appendChild(el("div", "card-content"));
    if (label) body.appendChild(el("p", "is-size-7 has-text-grey-dark mb-3", uri));
    const tags = body.appendChild(el("div", "tags"));
    typeIdx.forEach(i => { tags.appendChild(el("span", "tag", labels[i])).title = types[i]; });
    const stats = body.appendChild(el("div", "level is-mobile"));
    stats.append(
      stat(asSubject + asObject, "Triples"),
      stat(asSubject, "As subject"),
      stat(asObject, "As object"),
      stat(related, "Linked entities")
    );
    return c;
  }

  function pageRange(current, total) {
    const out = [];
    let last = 0;
    for (let i = 1; i <= total; i++) {
      if (i === 1 || i === total || Math.abs(i - current) <= 2) {
        if (i - last > 1) out.push("…");
        out.push(i);
        last = i;
      }
    }
    return out;
  }

  function render() {
    const total = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    page = Math.min(page, total);
    const start = (page - 1) * PAGE_SIZE;
    grid.replaceChildren(...visible.slice(start, start + PAGE_SIZE).map(i => card(rows[i])));
    counter.textContent = `${visible.length} of ${rows.length} entities`;
    list.replaceChildren(...pageRange(page, total).map(p => {
      const li = el("li");
      if (p === "…") {
        li.appendChild(el("span", "pagination-ellipsis", p));
      } else {
        const a = el("button", "pagination-link" + (p === page ? " is-current" : ""), p);
        a.type = "button";
        a.setAttribute("aria-label", `Page ${p}`);
        if (p === page) a.setAttribute("aria-current", "page");
        a.dataset.page = p;
        li.appendChild(a);
      }
      return li;
    }));
    prev.toggleAttribute("disabled", page === 1);
    next.toggleAttribute("disabled", page === total);
  }

  const go = p => { page = Math.max(1, p); render(); };
  list.addEventListener("click", e => { if (e.target.dataset.page) go(+e.target.dataset.page); });
  prev.addEventListener("click", () => go(page - 1));
  next.addEventListener("click", () => go(page + 1));
  filterInput.addEventListener("input", () => {
    const q = filterInput.value.trim().toLowerCase();
    visible = [];
    haystack.forEach((h, i) => { if (!q || h.includes(q)) visible.push(i); });
    go(1);
  });
  render();
});
</script>
{% endblock %}
