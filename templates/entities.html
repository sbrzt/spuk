{% extends "base.html" %}
{% from "_hero.html" import render_hero %}

{% block content %}
{{ render_hero("Entities", "List of entities", "entities", base_url) }}

<section class="section">
    <div class="field">
        <div class="control">
            <input id="entity-filter" class="input" type="search" placeholder="Filter by URI or type" autocomplete="off">
        </div>
        <p class="help" id="entity-count"></p>
    </div>
    <div id="entities-grid" class="grid is-col-min-24"></div>
</section>

<section class="section">
    <nav class="pagination is-centered" role="navigation" aria-label="pagination">
        <a class="pagination-previous" id="entity-prev">Previous</a>
        <a class="pagination-next" id="entity-next">Next</a>
        <ul class="pagination-list" id="pagination"></ul>
    </nav>
</section>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const PAGE_SIZE = 15;
  const grid = document.getElementById("entities-grid");
  const list = document.getElementById("pagination");
  const filterInput = document.getElementById("entity-filter");
  const counter = document.getElementById("entity-count");
  const prev = document.getElementById("entity-prev");
  const next = document.getElementById("entity-next");

  const { types, rows } = await (await fetch("{{ base_url }}entities.json")).json();
  const haystack = rows.map(r => (r[0] + " " + r[2].map(i => types[i]).join(" ")).toLowerCase());
  let visible = rows.map((_, i) => i);
  let page = 1;

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function card([uri, href, typeIdx, asSubject, asObject]) {
    const c = el("div", "card cell entity");
    c.appendChild(el("header", "card-header")).appendChild(el("p", "card-header-title", uri));
    const body = c.appendChild(el("div", "card-content"));
    const tags = body.appendChild(el("div", "tags"));
    typeIdx.forEach(i => tags.appendChild(el("span", "tag", types[i])));
    const info = body.appendChild(el("div", "content"));
    info.appendChild(el("p", "", `Triple count: ${asSubject + asObject}`));
    info.appendChild(el("p", "", `As subject: ${asSubject}`));
    info.appendChild(el("p", "", `As object: ${asObject}`));
    const link = el("a", "card-footer-item", "Go to entity page");
    link.href = href;
    c.appendChild(el("footer", "card-footer")).appendChild(link);
    return c;
  }

  function pageRange(current, total) {
    const out = [];
    let last = 0;
    for (let i = 1; i <= total; i++) {
      if (i === 1 || i === total || Math.abs(i - current) <= 2) {
        if (i - last > 1) out.push("…");
        out.push(i);
        last = i;
      }
    }
    return out;
  }

  function render() {
    const total = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    page = Math.min(page, total);
    const start = (page - 1) * PAGE_SIZE;
    grid.replaceChildren(...visible.slice(start, start + PAGE_SIZE).map(i => card(rows[i])));
    counter.textContent = `${visible.length} of ${rows.length} entities`;
    list.replaceChildren(...pageRange(page, total).map(p => {
      const li = el("li");
      if (p === "…") {
        li.appendChild(el("span", "pagination-ellipsis", p));
      } else {
        const a = el("a", "pagination-link" + (p === page ? " is-current" : ""), p);
        a.dataset.page = p;
        li.appendChild(a);
      }
      return li;
    }));
    prev.toggleAttribute("disabled", page === 1);
    next.toggleAttribute("disabled", page === total);
  }

  const go = p => { page = Math.max(1, p); render(); };
  list.addEventListener("click", e => { if (e.target.dataset.page) go(+e.target.dataset.page); });
  prev.addEventListener("click", () => go(page - 1));
  next.addEventListener("click", () => go(page + 1));
  filterInput.addEventListener("input", () => {
    const q = filterInput.value.trim().toLowerCase();
    visible = [];
    haystack.forEach((h, i) => { if (!q || h.includes(q)) visible.push(i); });
    go(1);
  });
  render();
});
</script>
{% endblock %}
